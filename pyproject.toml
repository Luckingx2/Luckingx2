[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-studio"
version = "0.1.0"
description = "AI content research, prompt, and publishing workspace"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
ai-content = "ai_content_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

